# ====================================================================
# BUA Student ID Portal – High Performance Nginx Configuration
# ====================================================================

# Upstream Gunicorn server
upstream bua_app {
    server 127.0.0.1:5000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain (e.g. portal.bua.edu.eg)

    # Maximum upload size for student photo uploads
    client_max_body_size 10M;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # 1. Direct Static Serving from NVMe SSD (Bypasses Python completely)
    location /static/ {
        alias /var/www/bua/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 2. Direct Student Photos Serving from NVMe SSD
    location /static/uploads/ {
        alias /var/www/bua/static/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 3. Dynamic Application Reverse Proxy to Gunicorn
    location / {
        proxy_pass http://bua_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
